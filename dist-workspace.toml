# cargo-dist config. Regenerate with `dist init` once cargo-dist is installed.
[workspace]
members = ["cargo:crates/wglane-cli", "cargo:crates/wglane-macos"]

# Config for 'dist'
[dist]
# CI backends to support
ci = "github"
# The installers to generate for each app. GitHub release archives only for now;
# to add Homebrew later: installers = ["homebrew"], tap = "nyashkn/homebrew-tap",
# publish-jobs = ["homebrew"], then `dist generate` (needs HOMEBREW_TAP_TOKEN).
installers = []
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin"]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# publish = false (workspace-wide) hides binaries from dist; opt packages back in.
dist = true
# release-please creates the GitHub Release when its PR merges; dist only uploads to it.
create-release = false
