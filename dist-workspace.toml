# cargo-dist config. Regenerate with `dist init` once cargo-dist is installed.
[workspace]
members = ["cargo:crates/wglane-cli", "cargo:crates/wglane-macos"]

# Config for 'dist'
[dist]
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["homebrew"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin"]
# A GitHub repo to push Homebrew formulas to
tap = "OWNER/homebrew-tap"
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# publish = false (workspace-wide) hides binaries from dist; opt packages back in.
dist = true
# Formula is pushed to the tap only by the tag-triggered workflow (needs HOMEBREW_TAP_TOKEN).
publish-jobs = ["homebrew"]
