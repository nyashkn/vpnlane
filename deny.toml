# cargo-deny: licenses, advisories, duplicate versions, sources.
[graph]
all-features = true

[advisories]
# Unmaintained crates are reported for direct deps only; vulnerabilities always fail.
unmaintained = "workspace"
yanked = "deny"

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9
# The allow list is policy, not inventory: unused entries are fine.
unused-allowed-license = "allow"

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Path deps inside the workspace have no version; that is fine.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
