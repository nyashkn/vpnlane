name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CI: "true"

jobs:
  ci:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      # rust-toolchain.toml pins the version; rustup installs it on first use.
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-deny
      # `just ci` includes check-versions (release-please manifest vs Cargo.toml/Cargo.lock).
      - run: just ci
