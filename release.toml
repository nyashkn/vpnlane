# cargo-release config. Dry run is the default; the owner passes --execute.
# CHANGELOG.md: entries go under [Unreleased]; cargo release stamps the version.
shared-version = true
tag-name = "v{{version}}"
pre-release-hook = ["just", "ci"]
publish = false
push = false
# One bump commit/tag for the whole workspace, not one per crate.
consolidate-commits = true

[[pre-release-replacements]]
file = "CHANGELOG.md"
search = "## \\[Unreleased\\]"
replace = "## [Unreleased]\n\n## [{{version}}] - {{date}}"
exactly = 1
