[package]
name = "wglane-cli"
description = "wglane: NordLynx/WireGuard tunnels on macOS that leave Tailscale working."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[[bin]]
name = "wglane"
path = "src/main.rs"

[features]
default = ["tui"]
# Full-screen dashboard (`wglane tui`).
tui = ["dep:ratatui"]

[dependencies]
clap.workspace = true
clap_complete.workspace = true
color-eyre.workspace = true
ratatui = { workspace = true, optional = true }
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
wglane-core.workspace = true
wglane-macos.workspace = true
wglane-nord.workspace = true

[dev-dependencies]
insta.workspace = true
tempfile.workspace = true
wglane-core = { workspace = true, features = ["testing"] }
wglane-macos = { workspace = true, features = ["testing"] }

[lints]
workspace = true
