[package]
name = "wglane-cli"
description = "wglane: NordLynx/WireGuard tunnels on macOS that leave Tailscale working."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true

[[bin]]
name = "wglane"
path = "src/main.rs"

[[bin]]
# Root-side helper; installed root-owned by `wglane install-helper`. Lives here so
# it ships in the same release archive as `wglane`.
name = "wglane-helper"
path = "src/bin/wglane-helper.rs"

[features]
default = ["tui"]
# Full-screen dashboard (`wglane tui`).
tui = ["dep:ratatui"]

[dependencies]
clap.workspace = true
clap_complete.workspace = true
color-eyre.workspace = true
ratatui = { workspace = true, optional = true }
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
vpnlane-core.workspace = true
vpnlane-macos.workspace = true
vpnlane-nord.workspace = true

[dev-dependencies]
insta.workspace = true
tempfile.workspace = true
vpnlane-core = { workspace = true, features = ["testing"] }
vpnlane-macos = { workspace = true, features = ["testing"] }

[lints]
workspace = true
